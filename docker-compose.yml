services:
  frontend:
    image: frontend:0.1.0
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: agent-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      gateway:
        condition: service_healthy

  gateway:
    image: gateway:0.1.0
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: llm-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - gateway-logs:/app/logs
    depends_on:
      llm:
        condition: service_healthy
      mqtt:
        condition: service_started

  mqtt:
    image: eclipse-mosquitto:2
    container_name: mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log

  llm:
    image: llama-runtime:0.1.0
    build:
      context: .
      dockerfile: Dockerfile.llama-runtime
    container_name: llama-llm
    restart: unless-stopped
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
      - "992"
    environment:
      - LLAMA_CACHE=/cache
    volumes:
      - ${LLAMA_ROCM_DIR:?set LLAMA_ROCM_DIR in .env}:/opt/llama:ro
      - ${MODELS_DIR:-./models}:/models:ro
      - llama-cache:/cache
    expose:
      - "8080"
    ports:
      - "8081:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -lc ': >/dev/tcp/127.0.0.1/8080'"
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 2m
    command:
      - /opt/llama/llama-server
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -m
      - /models/${LLAMA_MODEL_FILE:-Qwen3.6-27B-IQ4_XS.gguf}
      - --mmproj
      - /models/mmproj-F16.gguf
      - --ctx-size
      - "36864"
      - --n-gpu-layers
      - "99"
      - --flash-attn
      - "on"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --reasoning-format
      - deepseek
      - --parallel
      - "6"

volumes:
  gateway-logs:
  llama-cache:
  mqtt-data:
  mqtt-log:
